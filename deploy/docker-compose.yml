# Запуск на ВМ. Переменные берутся из .env рядом с этим файлом — его генерирует deploy:vm
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      sage.logs: "true"
    restart: unless-stopped

  app:
    image: ${IMAGE_NAME:?IMAGE_NAME is required}
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - CORS_ALLOW_LOCALHOST=${CORS_ALLOW_LOCALHOST:-1}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_TLS=${SMTP_TLS:-starttls}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy
    labels:
      sage.logs: "true"
    restart: unless-stopped

  # Отправка логов app и db в Sage. Запускается, только если включён профиль sage:
  # deploy:vm включает его, когда задана CI-переменная SAGE_TOKEN
  vector:
    image: timberio/vector:0.59.0-alpine
    profiles: ["sage"]
    command: ["--config", "/etc/vector/vector.yaml", "--dangerously-allow-env-var-interpolation"]
    environment:
      - SAGE_GROUP=${SAGE_GROUP:-hack-led-19}
      - SAGE_TOKEN=${SAGE_TOKEN:-}
      - SAGE_ENV=${SAGE_ENV:-prod}
      - SAGE_INST=${SAGE_INST:-petcare-vm}
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  pgdata:

networks:
  app_network:
    driver: bridge
