services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: petcare
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d petcare" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: dev
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/petcare
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - CORS_ALLOW_LOCALHOST=${CORS_ALLOW_LOCALHOST:-1}
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
    volumes:
      - .:/app
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

networks:
  app_network:
    driver: bridge
